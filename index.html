<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Perpustakaan PDKT — Reading Hub</title>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --panel-hover: #283548;
      --border: #334155;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-soft: rgba(56, 189, 248, 0.14);
      --success: #22c55e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Top Bar — 1 baris ramping untuk Desktop & Mobile */
    header {
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 0 12px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      z-index: 15;
    }

    .left-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      flex: 1;
    }

    .menu-btn {
      display: none;
      background: var(--panel-hover);
      color: var(--text);
      border: 1px solid var(--border);
      width: 34px;
      height: 34px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      flex-shrink: 0;
      align-items: center;
      justify-content: center;
    }

    .title-wrap {
      min-width: 0;
      flex: 1;
    }

    .current-title {
      font-size: 0.9rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .current-sub {
      font-size: 0.72rem;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .btn {
      background: #0f172a;
      color: var(--text);
      border: 1px solid var(--border);
      height: 32px;
      padding: 0 10px;
      border-radius: 7px;
      font-size: 0.78rem;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: background 0.15s;
    }

    .btn:hover:not(:disabled) { background: var(--panel-hover); }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; }

    .btn-primary {
      background: var(--accent);
      color: #0f172a;
      border-color: var(--accent);
      font-weight: 600;
    }

    .btn-done.active {
      background: rgba(34, 197, 94, 0.18);
      border-color: var(--success);
      color: var(--success);
    }

    /* Main Layout */
    .layout {
      display: flex;
      flex: 1;
      min-height: 0;
      position: relative;
    }

    /* Sidebar */
    aside {
      width: 300px;
      background: var(--panel);
      border-right: 1px solid var(--border);
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
    }

    .sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 4px;
    }

    .sidebar-header h1 {
      font-size: 0.9rem;
      font-weight: 700;
    }

    .progress-badge {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--success);
      background: rgba(34, 197, 94, 0.12);
      padding: 3px 8px;
      border-radius: 99px;
    }

    .book-card {
      background: rgba(15, 23, 42, 0.55);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 10px 12px;
      cursor: pointer;
      transition: all 0.16s ease;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .book-card:hover { background: var(--panel-hover); }
    .book-card.active {
      background: var(--accent-soft);
      border-color: var(--accent);
    }

    .book-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.68rem;
    }

    .badge {
      color: var(--accent);
      font-weight: 600;
    }

    .done-pill {
      color: var(--success);
      font-weight: 600;
      display: none;
    }

    .book-card.done .done-pill { display: inline; }

    .book-title {
      font-size: 0.85rem;
      font-weight: 600;
      line-height: 1.3;
    }

    .book-desc {
      font-size: 0.74rem;
      color: var(--muted);
      line-height: 1.35;
    }

    /* Viewer Area */
    main {
      flex: 1;
      display: flex;
      min-width: 0;
      background: #0b1120;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: #1e293b;
    }

    /* Backdrop untuk mobile drawer */
    .backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      z-index: 18;
    }
    .backdrop.show { display: block; }

    /* Mode Fokus (Fullscreen PDF) */
    body.focus-mode header,
    body.focus-mode aside {
      display: none !important;
    }

    .exit-focus {
      display: none;
      position: fixed;
      top: 10px;
      right: 12px;
      z-index: 30;
      background: rgba(15, 23, 42, 0.85);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 6px 10px;
      border-radius: 99px;
      font-size: 0.75rem;
      cursor: pointer;
      backdrop-filter: blur(6px);
    }

    body.focus-mode .exit-focus { display: inline-flex; }

    /* Mobile Optimization */
    @media (max-width: 820px) {
      header {
        height: 46px;
        padding: 0 8px;
      }

      .menu-btn { display: inline-flex; }
      .current-sub { display: none; }
      .btn-label { display: none; }
      .btn {
        padding: 0 8px;
        height: 30px;
        font-size: 0.82rem;
      }

      aside {
        position: fixed;
        top: 0;
        bottom: 0;
        left: 0;
        width: 82%;
        max-width: 310px;
        z-index: 25;
        transform: translateX(-100%);
        transition: transform 0.22s ease;
        box-shadow: 6px 0 24px rgba(0, 0, 0, 0.6);
      }

      aside.open { transform: translateX(0); }
    }
  </style>
</head>
<body>

  <button class="exit-focus" id="exitFocusBtn">✕ Keluar Fokus</button>

  <header>
    <div class="left-bar">
      <button class="menu-btn" id="menuBtn" title="Daftar PDF">☰</button>
      <div class="title-wrap">
        <div class="current-title" id="currentTitle">Memuat...</div>
        <div class="current-sub" id="currentSub"></div>
      </div>
    </div>

    <div class="actions">
      <button class="btn" id="prevBtn" title="Sebelumnya">‹</button>
      <button class="btn" id="nextBtn" title="Selanjutnya">›</button>
      <button class="btn btn-done" id="doneBtn" title="Tandai Selesai">✓<span class="btn-label"> Selesai</span></button>
      <a class="btn btn-primary" id="openNewTab" href="#" target="_blank" rel="noopener" title="Buka Tab Baru">↗<span class="btn-label"> Tab Baru</span></a>
      <button class="btn" id="focusBtn" title="Mode Fokus Fullscreen">⛶</button>
    </div>
  </header>

  <div class="backdrop" id="backdrop"></div>

  <div class="layout">
    <aside id="sidebar">
      <div class="sidebar-header">
        <h1>📚 Reading Hub</h1>
        <span class="progress-badge" id="progressText">0/6</span>
      </div>
      <div id="bookList"></div>
    </aside>

    <main>
      <iframe id="pdfFrame" title="PDF Viewer"></iframe>
    </main>
  </div>

  <script>
    const books = [
      {
        id: "pdkt-tanpa-drama",
        step: "Tahap 1 • Utama",
        title: "PDKT Tanpa Drama",
        desc: "Mindset dasar PDKT sehat, atasi overthinking, baca sinyal, & jaga harga diri.",
        file: "PDKT Tanpa Drama.pdf"
      },
      {
        id: "percaya-diri",
        step: "Tahap 2 • Bonus",
        title: "Ngobrol Percaya Diri Tanpa Jadi Sok Jago",
        desc: "Cara tenang saat ngobrol, berhenti berusaha terlihat hebat, & hadapi penolakan.",
        file: "BONUS_NGOBROL PERCAYA DIRI TANPA JADI SOK JAGO.pdf"
      },
      {
        id: "tanpa-garing",
        step: "Tahap 3 • Bonus",
        title: "Ngobrol Tanpa Garing",
        desc: "Opening natural dari konteks & rumus Respon → Tambahan → Pertanyaan.",
        file: "BONUS_NGOBROL TANPA GARING.pdf"
      },
      {
        id: "nol-sampai-nyaman",
        step: "Tahap 4 • Bonus",
        title: "Chat dari Nol sampai Nyaman",
        desc: "Panduan lengkap dari chat pertama, timing balas, sampai ajak ketemu langsung.",
        file: "BONUS_Chat dari Nol sampai Nyaman.pdf"
      },
      {
        id: "100-template",
        step: "Tahap 5 • Bonus",
        title: "100 Template Chat yang Menarik & Nyaman",
        desc: "Kumpulan inspirasi kalimat pembuka, follow-up, humor halus, & ajakan ketemu.",
        file: "BONUS_100 TEMPLATE CHAT YANG MENARIK & NYAMAN.pdf"
      },
      {
        id: "komunikasi-dewasa",
        step: "Tahap 6 • Bonus",
        title: "Komunikasi Dewasa & Berkelas",
        desc: "Validasi emosi, menjaga batasan sehat, jadi pendengar aktif tanpa tarik-ulur.",
        file: "BONUS_KOMUNIKASI DEWASA & BERKELAS DENGAN PEREMPUAN.pdf"
      }
    ];

    const STORAGE_KEY = "pdkt_reading_progress_v1";
    let completed = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
    let currentIndex = 0;

    const bookListEl = document.getElementById("bookList");
    const pdfFrame = document.getElementById("pdfFrame");
    const currentTitle = document.getElementById("currentTitle");
    const currentSub = document.getElementById("currentSub");
    const openNewTab = document.getElementById("openNewTab");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const doneBtn = document.getElementById("doneBtn");
    const progressText = document.getElementById("progressText");
    const sidebar = document.getElementById("sidebar");
    const backdrop = document.getElementById("backdrop");
    const menuBtn = document.getElementById("menuBtn");
    const focusBtn = document.getElementById("focusBtn");
    const exitFocusBtn = document.getElementById("exitFocusBtn");

    function closeDrawer() {
      sidebar.classList.remove("open");
      backdrop.classList.remove("show");
    }

    function renderSidebar() {
      bookListEl.innerHTML = "";
      books.forEach((book, idx) => {
        const isDone = completed.includes(book.id);
        const card = document.createElement("div");
        card.className = `book-card ${idx === currentIndex ? "active" : ""} ${isDone ? "done" : ""}`;
        card.innerHTML = `
          <div class="book-top">
            <span class="badge">${book.step}</span>
            <span class="done-pill">✓ Selesai</span>
          </div>
          <div class="book-title">${book.title}</div>
          <div class="book-desc">${book.desc}</div>
        `;
        card.addEventListener("click", () => {
          selectBook(idx);
          closeDrawer();
        });
        bookListEl.appendChild(card);
      });

      progressText.textContent = `${completed.length}/${books.length} Selesai`;
    }

    function selectBook(index) {
      currentIndex = index;
      const book = books[index];
      const safeUrl = "./" + encodeURIComponent(book.file);

      currentTitle.textContent = book.title;
      currentSub.textContent = book.step;
      pdfFrame.src = safeUrl;
      openNewTab.href = safeUrl;

      prevBtn.disabled = index === 0;
      nextBtn.disabled = index === books.length - 1;

      const isDone = completed.includes(book.id);
      doneBtn.classList.toggle("active", isDone);
      renderSidebar();
    }

    doneBtn.addEventListener("click", () => {
      const id = books[currentIndex].id;
      completed = completed.includes(id)
        ? completed.filter(item => item !== id)
        : [...completed, id];
      localStorage.setItem(STORAGE_KEY, JSON.stringify(completed));
      selectBook(currentIndex);
    });

    prevBtn.addEventListener("click", () => { if (currentIndex > 0) selectBook(currentIndex - 1); });
    nextBtn.addEventListener("click", () => { if (currentIndex < books.length - 1) selectBook(currentIndex + 1); });

    menuBtn.addEventListener("click", () => {
      sidebar.classList.toggle("open");
      backdrop.classList.toggle("show");
    });

    backdrop.addEventListener("click", closeDrawer);

    focusBtn.addEventListener("click", () => document.body.classList.add("focus-mode"));
    exitFocusBtn.addEventListener("click", () => document.body.classList.remove("focus-mode"));

    selectBook(0);
  </script>
</body>
</html>
